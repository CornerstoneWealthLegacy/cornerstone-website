<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call Card | Truestead</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png?v=2">
  <style>
    :root { --navy:#0f2744; --gold:#c49a2a; --ink:#1f2937; --line:#e2e8f0; --bg:#f4f3f0; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,Inter,Arial,sans-serif; }
    header { background:var(--navy); color:#fff; padding:14px 16px; font-weight:700; letter-spacing:.04em; }
    header span { color:var(--gold); }
    main { max-width:560px; margin:0 auto; padding:16px 16px 40px; }
    label { display:block; font-size:.88rem; font-weight:600; color:var(--navy); margin:0 0 12px; }
    input, select, textarea { display:block; width:100%; margin-top:4px; padding:11px 12px; border:1.5px solid var(--line); border-radius:9px; font:inherit; font-size:16px; background:#fff; color:var(--ink); }
    textarea { min-height:96px; }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--gold); }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
    .seg { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:4px 0 14px; }
    .seg label { margin:0; display:flex; align-items:center; gap:8px; font-weight:500; color:var(--ink); border:1.5px solid var(--line); border-radius:9px; padding:11px 10px; background:#fff; }
    .seg label:has(input:checked) { border-color:var(--gold); background:rgba(196,154,42,.1); }
    .seg input { width:auto; margin:0; }
    .h { font-size:.88rem; font-weight:600; color:var(--navy); margin:0; }
    button { width:100%; background:var(--navy); color:#fff; border:0; border-radius:10px; padding:14px; font:inherit; font-weight:700; font-size:1rem; }
    button[disabled] { opacity:.6; }
    #status { margin-top:10px; font-size:.9rem; color:#92400e; min-height:1.2em; }
    .ok { color:#166534 !important; }
    #keybox { background:#fff; border:1.5px solid var(--gold); border-radius:12px; padding:16px; }
    .small { font-size:.8rem; color:#64748b; }
  </style>
</head>
<body>
  <header>TRUESTEAD <span>·</span> Call card</header>
  <main>
    <div id="keybox" hidden>
      <label>Card key <span class="small">(once per phone; stored in this browser only)</span><input type="password" id="key" autocomplete="off"></label>
      <button type="button" id="savekey">Save key</button>
    </div>

    <form id="card" hidden>
      <div class="row">
        <label>Client name <input type="text" name="client_name" required autocomplete="off"></label>
        <label>Phone <input type="tel" name="phone" autocomplete="off"></label>
      </div>
      <label>Email <input type="email" name="email" autocomplete="off"></label>
      <div class="row">
        <label>Matter
          <select name="matter" id="matter"></select>
        </label>
        <label>Fee <input type="text" name="fee" id="fee" inputmode="decimal"></label>
      </div>
      <label>Facts (three lines) <textarea name="facts" placeholder="Who, what property or estate, anything unusual"></textarea></label>
      <p class="h">Outcome</p>
      <div class="seg">
        <label><input type="radio" name="outcome" value="engaged"> Engaged on the call</label>
        <label><input type="radio" name="outcome" value="send_engagement" checked> Send the engagement</label>
        <label><input type="radio" name="outcome" value="thinking"> Thinking it over</label>
        <label><input type="radio" name="outcome" value="not_a_fit"> Not a fit</label>
      </div>
      <p class="h">Send the intake form</p>
      <div class="seg">
        <label><input type="radio" name="send_intake" value="yes" checked> Yes</label>
        <label><input type="radio" name="send_intake" value="no"> No</label>
      </div>
      <button type="submit" id="send">Save card</button>
      <div id="status" role="status"></div>
      <p class="small"><a href="#" id="forget">Forget key on this phone</a></p>
    </form>
  </main>

  <script>
  (function () {
    // Flat Fee Menu lines (vault: 02 - Truestead Law/Flat Fee Menu.md, read 10/28/2026).
    // Attorney prices only. Update here when the menu changes.
    var MENU = [
      ['', ''],
      ['Lady Bird deed', '$399'],
      ['Quitclaim deed', '$349'],
      ['Warranty deed', '$399'],
      ['Add spouse to homestead title', '$349'],
      ['Deed into trust', '$349'],
      ['Deed into LLC', '$349'],
      ['Deed with a complication', '$399 to $450'],
      ['Foreign or out-of-state owner deed', '$450 to $650'],
      ['Certificate of Trust', '$450'],
      ['Notice of Trust filing', '$350'],
      ['Trust-to-individual transfer', '$1,500'],
      ['POA + surrogate + living will bundle', '$500'],
      ['Essentials (single / couple)', '$950 / $1,450'],
      ['Will (single / couple)', '$850 / $1,300'],
      ['Trust (single / couple)', '$2,200 / $2,950'],
      ['Will + Trust (single / couple)', '$2,950 / $3,750'],
      ['Trust amendment', '$350'],
      ['Trust restatement', '$750'],
      ['Will codicil', '$250'],
      ['Summary administration, no real property', '$1,495'],
      ['Summary administration, with real property', '$2,495'],
      ['Medicaid crisis planning', '$7,500'],
      ['Medicaid pre-planning', '$4,500'],
      ['Medicaid application only', '$2,500'],
      ['Qualified Income Trust package', '$850'],
      ['Medicaid gift cure', '$2,500'],
      ['Medicaid or QMB eligibility correction', '$2,500'],
      ['Adult guardianship, uncontested', '$3,500 + costs'],
      ['Postnuptial agreement', '$1,500'],
      ['Contract review with written opinion', '$850'],
      ['Paperwork and release review', '$450'],
      ['Florida LLC, attorney-formed', '$499'],
      ['Other (custom fee)', '']
    ];
    var sel = document.getElementById('matter'), fee = document.getElementById('fee');
    MENU.forEach(function (m) { var o = document.createElement('option'); o.value = m[0]; o.textContent = m[0] ? m[0] + (m[1] ? '  ' + m[1] : '') : 'Choose'; sel.appendChild(o); });
    sel.addEventListener('change', function () { var m = MENU[sel.selectedIndex]; fee.value = m ? m[1] : ''; });

    var K = 'truestead_call_card_key';
    function getKey() { try { return localStorage.getItem(K) || ''; } catch (e) { return ''; } }
    function setKey(v) { try { v ? localStorage.setItem(K, v) : localStorage.removeItem(K); } catch (e) {} }
    var mem = '';
    function show() {
      var has = getKey() || mem;
      document.getElementById('keybox').hidden = !!has;
      document.getElementById('card').hidden = !has;
    }
    document.getElementById('savekey').addEventListener('click', function () {
      var v = document.getElementById('key').value.trim(); if (!v) return; mem = v; setKey(v); show();
    });
    document.getElementById('forget').addEventListener('click', function (e) { e.preventDefault(); mem = ''; setKey(''); show(); });
    show();

    var form = document.getElementById('card');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var st = document.getElementById('status'), btn = document.getElementById('send');
      st.className = '';
      var d = {}; new FormData(form).forEach(function (v, k) { d[k] = v; });
      if (!String(d.client_name || '').trim()) { st.textContent = 'Client name is needed.'; return; }
      btn.disabled = true; st.textContent = 'Saving...';
      fetch('/.netlify/functions/capture-call-card', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'x-card-key': getKey() || mem }, body: JSON.stringify(d)
      }).then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
        .then(function (res) {
          btn.disabled = false;
          if (res.s === 401) { st.textContent = 'Key not accepted. Re-enter it.'; mem = ''; setKey(''); show(); return; }
          if (!res.j.ok) throw new Error(res.j.error || 'error');
          st.className = 'ok'; st.textContent = 'Saved (' + res.j.id + '). The morning list will carry the next step.';
          form.reset(); fee.value = '';
        })
        .catch(function () { btn.disabled = false; st.textContent = 'Did not save. Try again.'; });
    });
  })();
  </script>
</body>
</html>
