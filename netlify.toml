[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.gstatic.com https://apis.google.com https://www.google.com https://www.recaptcha.net https://assets.calendly.com https://www.googletagmanager.com https://connect.facebook.net https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.clarity.ms https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://assets.calendly.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: https://*.elevenlabs.io; worker-src 'self' blob:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://api.stripe.com https://firestore.googleapis.com https://cornerstone-wealth-and-legacy.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.twilio.com https://calendly.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://www.facebook.com https://connect.facebook.net https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com https://www.clarity.ms https://*.clarity.ms https://c.bing.com https://*.elevenlabs.io wss://*.elevenlabs.io https://unpkg.com; frame-src https://js.stripe.com https://hooks.stripe.com https://cornerstone-wealth-and-legacy.firebaseapp.com https://www.google.com https://www.recaptcha.net https://calendly.com https://td.doubleclick.net https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'"

[[headers]]
  for = "/start.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Static-asset caching for repeat-visit speed ──────────────────────────────
# Images rarely change → long cache. CSS/JS change with deploys → short cache so
# fixes propagate within an hour. (HTML keeps Netlify's must-revalidate default.)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

