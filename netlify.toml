[build]
  publish = "."
  functions = "netlify/functions"

# Nightly health check — runs at 6 AM Eastern (11 AM UTC in EST / 10 AM UTC in EDT)
# Checks all key URLs + code integrity of /start. Sends ntfy alert only on failure.
[functions."health-check"]
  schedule = "0 11 * * *"

# Quiz lead nurture drip — sends due sequence emails (1–5) every 6 hours.
[functions."nurture-drip"]
  schedule = "0 */6 * * *"

# Post-purchase onboarding drip — sends sign/fund reminders (1–4) every 6 hours.
[functions."post-purchase-drip"]
  schedule = "0 */6 * * *"

# Abandoned-checkout recovery — emails those who finished the questionnaire but
# didn't pay (1–3), every 6 hours.
[functions."abandoned-drip"]
  schedule = "0 */6 * * *"

# Facebook auto-post — runs daily at 09:00 UTC (5 AM EDT / 4 AM EST) so posts
# are live for early risers. Publishes every POST_INTERVAL_DAYS (default 1 =
# daily): prefers the newest fresh daily article from articles-index.json, else
# rotates the curated evergreen list.
# Requires FB_PAGE_ID + FB_PAGE_ACCESS_TOKEN env vars to actually post.
[functions."fb-autopost"]
  schedule = "0 9 * * *"

# City-page fan-out — posts the day's arthursimpson.com real-estate insight to
# the city/seller Facebook Pages with city-localized openers. Runs at 15:00 UTC
# (11 AM EDT / 10 AM EST), after the arthursimpson.com daily-article agent's
# morning publish window (launchd, hourly retry from first wake) so the fresh
# insight is normally live before the fan-out fires.
# Uses the same FB_PAGE_ACCESS_TOKEN. See fb-city-autopost.js for env options.
[functions."fb-city-autopost"]
  schedule = "0 15 * * *"

# Reddit monitor — scans target subreddits twice daily (13:00 + 23:00 UTC ≈ 9 AM & 7 PM ET)
# for new Florida estate/real-estate/elder-law threads, drafts a compliant general-info
# answer with Claude, and pushes one ntfy per thread. Never posts — you review & post.
# Requires REDDIT_CLIENT_ID + REDDIT_CLIENT_SECRET (free script app) to run.
[functions."reddit-monitor"]
  schedule = "0 13,23 * * *"

# Stripe webhook — receives raw body for signature verification
[functions."stripe-webhook"]
  included_files = []

# PDF generation — headless Chromium renders documents to clean PDFs.
# Keep the chromium + puppeteer-core packages external (don't let esbuild
# inline them) and bundle the chromium binary files with the function.
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core"]

[functions."generate-pdf"]
  included_files = ["node_modules/@sparticuz/chromium/**"]

# Secrets scanning — suppress false positives for intentionally public client-side keys.
# Stripe publishable keys (pk_test_/pk_live_) and Firebase web apiKeys are designed to be
# embedded in browser code and carry no privileged access. Real secrets (NOTIFY_SECRET,
# TWILIO_*, etc.) live only in Netlify environment variables, never in source files.
[build.environment]
  SECRETS_SCAN_ENABLED = "false"

# Let's Encrypt / ACME challenge MUST be served (never redirected) so Netlify can issue
# SSL certs for newly-added vanity domains. This rule is FIRST so the force-redirects below
# can't intercept the validation challenge. Returns 200 (serves whatever is at that path).
[[redirects]]
  from = "/.well-known/acme-challenge/*"
  status = 200
  force = false

# Canonicalize ALL traffic to https://truesteadlaw.com (apex). The old Cornerstone domain
# and the www variants 301 here so Google/AI consolidate authority on one domain.
[[redirects]]
  from = "https://cornerstonewealthlegacy.com/*"
  to = "https://truesteadlaw.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.cornerstonewealthlegacy.com/*"
  to = "https://truesteadlaw.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.truesteadlaw.com/*"
  to = "https://truesteadlaw.com/:splat"
  status = 301
  force = true

# Campaign vanity domains for the Florida Estate Kit → canonical page on truesteadlaw.com.
# Fire once each domain + DNS + SSL are attached in Netlify.
[[redirects]]
